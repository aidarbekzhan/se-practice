# week-08/submission.yml — your declaration for this lab.
#
# Facts only. Every explanation goes in lab-report.md; nothing here repeats prose.
# Fill every value. Check it before you push:
#
#     python tests/validate_submission.py
#
# The validator checks shape, never quality. A green run is the floor, not the grade.
# If you cannot run Python, fill the file by hand against the comments — a malformed
# file costs you nothing if the content is there.

schema: 1
week: "08"

student:
  name:
  student_id:          # as in KBTU records, e.g. 00X000000
  github:              # your GitHub username, the one that owns the repo

assistant:
  tool:                # the assistant you debugged with: ChatGPT, Claude, Claude Code, ...
  model:               # the exact model with its version, or: not displayed

skill:
  environment:         # chatgpt | claude-web | claude-code | prompt-only
  invoked:             # yes | no | not-shown   did the environment show that bug-detector was used?

project:
  language:            # ts | js   the file you copied from buggy/
  vitest:              # the Vitest version from the "RUN  v..." line, e.g. 3.2.4

counts:
  tests_final:         # tests in your final suite (app/.../booking.test.*)
  buggy_failed:        # failed tests when your Week 07 suite ran on the provided canBook (lab-report.md 2.2)
  defects_logged:      # rows in lab-report.md section 3
  lines_changed:       # lines of the canBook body you changed to fix both bugs (the checker prints it under B3)

checker:
  # Numbers from YOUR last run of: python tests/check_debugging.py
  # They must add up to the number of checks it runs (31).
  # Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing. A hidden one costs the criterion.
  pass:
  fail:
  error:
  commit:              # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)
  known_fails: []      # every check ID that is still FAIL or ERROR, explained in lab-report.md §9.1, e.g. [E1]

verdict:
  # Your judgement from lab-report.md section 7, against the actual code - not a guess.
  skill_helped:        # yes | no | no-difference

review_findings:
  # Three or more. One line each, and each one names what it is about: BUG-A, BUG-B, a test
  # (T01-T14, X1, X2, AC5), an AC, a step of the skill, or a file.
  # Worthless:        "The skill made the answer better"
  # Worth everything: "BUG-B: the AC5 test failed for the wrong reason until BUG-A was fixed - 660-720 was rejected before the push"
  -
  -
  -

honesty:
  buggy_function_pasted_unchanged:   # yes | no   you copied canBook from buggy/ exactly, before any fix
  same_input_both_chats:             # yes | no   sections 5 and 6 sent the same code, criteria and failure
  outputs_unedited:                  # yes | no   every run in lab-report.md is pasted from a real terminal
  ai_usage_disclosed:                # yes | no   AI_USAGE.md is complete
